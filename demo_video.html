<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalentPulse - MP4 Video Demo Walkthrough</title>
  <style>
    :root {
      --primary: #8B5CF6;
      --pink: #EC4899;
      --dark: #0F172A;
      --light: #F8FAFC;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      max-width: 800px;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 2.2rem;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, #A855F7 0%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      color: #94A3B8;
      font-size: 1rem;
      margin: 0;
    }
    .video-card {
      width: 100%;
      max-width: 1100px;
      background: #1E293B;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .player-screen {
      position: relative;
      width: 100%;
      background: #000;
      overflow: hidden;
      aspect-ratio: 16/10;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
    }
    .controls-bar {
      padding: 18px 24px;
      background: #0F172A;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn {
      background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
      color: #FFF;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🎬 TalentPulse - Native MP4 Demo Video</h1>
    <p>Video Rekaman Interaktif Aplikasi Full-Stack Talent Management CRM & Public Showcase (Bahasa Indonesia & Rupiah)</p>
  </div>

  <div class="video-card">
    <div class="player-screen">
      <video controls autoplay loop playsinline poster="talent_crm_demo.gif">
        <source src="talent_crm_demo.mp4" type="video/mp4">
        Browser Anda tidak mendukung pemutar video HTML5. Silakan buka file `talent_crm_demo.mp4` langsung.
      </video>
    </div>

    <div class="controls-bar">
      <div>
        <div style="font-weight:700; font-size:1.05rem; color:#FFF;">🎥 talent_crm_demo.mp4</div>
        <div style="font-size:0.85rem; color:#94A3B8;">Format: MP4 Native Video (30 FPS, 1440x900 High Definition)</div>
      </div>
      <a href="talent_crm_demo.mp4" download class="btn">⬇️ Download File Video MP4</a>
    </div>
  </div>

</body>
</html>
